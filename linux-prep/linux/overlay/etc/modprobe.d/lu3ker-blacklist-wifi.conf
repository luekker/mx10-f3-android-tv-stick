# Lu3ker: the Zero3's UWE5622 (Unisoc) WiFi/BT stack probes our AIC8800D80 SDIO card,
# fails, and rescans the SDIO bus. The Zero3 BSP lists sprdbt_tty in /etc/modules,
# which pulls in uwe5622_bsp_sdio, so block loading outright rather than just blacklisting.
install sprdwl_ng /bin/false
install uwe5622_bsp_sdio /bin/false
install sprdbt_tty /bin/false
